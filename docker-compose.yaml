services:
  db:
    image: postgres:latest
    container_name: spyglass_db
    env_file:
      - .env
    ports:
      - 5439:5432
    volumes:
      - spyglass_db_data:/var/lib/postgresql
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-spyglass}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  spyglass_db_data:
